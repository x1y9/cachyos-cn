name: CachyOS Custom ISO
on:
  push:
    branches:
    - master
    paths-ignore:
    - '.github/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
      options: --privileged
    name: Build
    outputs:
      builddate: ${{ steps.date.outputs.builddate }}
    steps:
      - name: Get build date
        id: date
        run: |
          echo "builddate=$(date +'%y%m%d')" >> $GITHUB_OUTPUT

      - name: Clone CachyOS-Live-ISO
        id: clone
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check disk space
        id: disk
        run: |
          df -h / | tail -1

      - name: Add CachyOS keyring
        id: keyring
        run: |
          pacman-key --init
          pacman-key --recv-keys F3B607488DB35A47 --keyserver keyserver.ubuntu.com
          pacman-key --lsign-key F3B607488DB35A47

          sed -i '/^\[core\]$/i[cachyos]\nServer = https://mirror.cachyos.org/repo/$arch/$repo\n' /etc/pacman.conf

      - name: Install dependencies
        id: dependencies
        run: |
          sudo pacman -Syu --noconfirm archiso cachyos-keyring mkinitcpio-archiso squashfs-tools grub git

      - name: Create build user
        id: user-archiso
        run: |
          useradd builder -m
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chmod -R a+rw .

      - name: Build hysteria2 AUR package (hysteria-bin)
        id: hysteria
        run: |
          sudo -H -E -u builder git clone --depth 1 https://aur.archlinux.org/hysteria-bin.git /tmp/hysteria-bin
          sudo -H -E -u builder bash -c 'cd /tmp/hysteria-bin && makepkg -s --noconfirm'
          cp /tmp/hysteria-bin/hysteria-*.pkg.tar.zst archiso/airootfs/root/
          ls -lh archiso/airootfs/root/

      - name: Build ISO (${{ steps.date.outputs.builddate }})
        id: build
        run: |
          sudo -H -E -u builder ./buildiso.sh

      - name: Upload ISO to artifacts
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: cachyos-desktop-linux-${{ steps.date.outputs.builddate }}
          path: out/desktop/*
          retention-days: 30

      - name: Split ISO for GitHub Release (>2GB limit)
        id: split
        run: |
          cd out/desktop
          ls -lh
          ISO=$(ls *.iso | head -1)
          split -b 1900M -d -a 2 "$ISO" cachyos-iso.part
          # 合并后 ISO 的预期哈希 (与分卷哈希区分开)
          sha256sum "$ISO" > merged.sha256
          sha256sum cachyos-iso.part* > parts.sha256
          cat > merge.sh <<EOF
          #!/bin/bash
          # 合并分卷还原 ISO (校验合并结果)
          set -e
          cd "\$(dirname "\$0")"
          cat cachyos-iso.part* > cachyos.iso
          EXPECTED=\$(awk '{print \$1}' merged.sha256)
          ACTUAL=\$(sha256sum cachyos.iso | awk '{print \$1}')
          if [ "\$EXPECTED" = "\$ACTUAL" ]; then
            echo "OK: cachyos.iso 校验通过 (\$ACTUAL)"
          else
            echo "FAIL: 校验不匹配! 请重新下载全部 part 文件"
            echo "expected: \$EXPECTED"
            echo "actual:   \$ACTUAL"
            exit 1
          fi
          EOF
          chmod +x merge.sh
          ls -lh

      - name: Publish Release
        id: release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: cachyos-custom-${{ steps.date.outputs.builddate }}
          name: CachyOS 中文定制版 ${{ steps.date.outputs.builddate }}
          body: |
            ## CachyOS 中文定制版 ISO

            基于官方 CachyOS-Live-ISO (KDE Plasma)，预装：
            - **fcitx5 中文输入法** — 拼音默认启用 (Ctrl+Space 切换)，含 Rime
            - **WPS Office** 国际版 11.1.0 (CachyOS 官方仓库)
            - **Hysteria2** 2.9.x (AUR hysteria-bin，含 systemd 服务)
            - **noto-fonts-cjk** 中文字体

            ### 下载与合并
            GitHub Release 单文件限制 2GB，ISO 已拆分为 `cachyos-iso.part00/01/...`：
            ```bash
            # 下载全部 part 文件 + merge.sh + parts.sha256 到同一目录
            chmod +x merge.sh && ./merge.sh
            # 得到 cachyos.iso，校验通过后即可写入 U 盘安装
            ```
            其他文件（安装脚本/配置模板）见仓库根目录 `setup.sh`、`configs/`。
          files: |
            out/desktop/cachyos-iso.part*
            out/desktop/parts.sha256
            out/desktop/merged.sha256
            out/desktop/merge.sh
          fail_on_unmatched_files: true
