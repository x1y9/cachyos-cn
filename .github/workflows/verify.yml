name: Verify ISO
on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    name: Merge & Verify
    steps:
      - name: Download parts & checksums
        id: download
        run: |
          RELEASE_TAG=$(gh api repos/${{ github.repository }}/releases/latest --jq '.tag_name')
          echo "latest release: $RELEASE_TAG"
          BASE="https://github.com/${{ github.repository }}/releases/download/$RELEASE_TAG"
          DATE="${RELEASE_TAG##*-}"
          curl -4 -sL -o part00 "$BASE/cachyos-iso.part00"
          curl -4 -sL -o part01 "$BASE/cachyos-iso.part01"
          curl -4 -sL -o expected.sha256 "$BASE/cachyos-desktop-linux-${DATE}.iso.sha256"
          ls -lh

      - name: Merge & compare hash
        id: merge
        run: |
          cat part00 part01 > merged.iso
          echo "merged size: $(stat -c%s merged.iso)"
          ACTUAL=$(sha256sum merged.iso | awk '{print $1}')
          EXPECTED=$(awk '{print $1}' expected.sha256)
          echo "actual:   $ACTUAL"
          echo "expected: $EXPECTED"
          if [ "$ACTUAL" = "$EXPECTED" ]; then
            echo "HASH: PASS"
          else
            echo "HASH: FAIL (跨构建版本错配或文件损坏)"
          fi

      - name: Check ISO structure
        id: structure
        run: |
          echo "--- file type ---"
          file merged.iso || true
          echo "--- ISO9660 / isohybrid / El Torito check ---"
          python3 scripts/verify_iso.py merged.iso || true
          echo "--- try 7z (if available) ---"
          (7z l merged.iso 2>&1 | head -12 || true)
