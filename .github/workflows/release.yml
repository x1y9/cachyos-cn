name: Publish Release (manual)
on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    name: Split & Publish
    steps:
      - name: Download latest ISO artifact
        id: download
        uses: actions/download-artifact@v4
        with:
          pattern: cachyos-desktop-linux-*
          path: iso
          merge-multiple: true
          run-id: 31480294627

      - name: Split ISO (>2GB GitHub limit)
        id: split
        run: |
          cd iso
          ls -lh
          ISO=$(ls *.iso | head -1)
          [ -n "$ISO" ] || { echo "no iso found"; exit 1; }
          TAG="cachyos-custom-$(date +%y%m%d)"
          split -b 1900M -d -a 2 "$ISO" cachyos-iso.part
          rm -f "$ISO"
          sha256sum cachyos-iso.part* > parts.sha256
          cat > merge.sh <<'EOF'
          #!/bin/bash
          # 合并分卷还原 ISO
          set -e
          cd "$(dirname "$0")"
          cat cachyos-iso.part* > cachyos.iso
          sha256sum -c parts.sha256
          echo "OK, merged: cachyos.iso"
          EOF
          chmod +x merge.sh
          echo "TAG=$TAG" >> $GITHUB_ENV
          ls -lh

      - name: Publish Release
        id: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: CachyOS 中文定制版 ${{ env.TAG }}
          body: |
            ## CachyOS 中文定制版 ISO

            基于官方 CachyOS-Live-ISO (KDE Plasma)，预装：
            - **fcitx5 中文输入法** — 拼音默认启用 (Ctrl+Space 切换)，含 Rime
            - **WPS Office** 国际版 11.1.0 (CachyOS 官方仓库)
            - **Hysteria2** 2.9.x (AUR hysteria-bin，含 systemd 服务)
            - **noto-fonts-cjk** 中文字体

            ### 下载与合并
            GitHub Release 单文件限制 2GB，ISO 已拆分为 `cachyos-iso.part00/01/...`：
            ```bash
            # 下载全部 part 文件 + merge.sh + parts.sha256 到同一目录
            chmod +x merge.sh && ./merge.sh
            # 得到 cachyos.iso，校验通过后即可写入 U 盘安装
            ```
            其他文件（安装脚本/配置模板）见仓库根目录 `setup.sh`、`configs/`。
          files: |
            iso/cachyos-iso.part*
            iso/parts.sha256
            iso/merge.sh
          fail_on_unmatched_files: true
